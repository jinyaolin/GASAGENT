<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #e8efff;
    --ok: #16a34a;
    --ok-soft: #e7f7ec;
    --fail: #dc2626;
    --fail-soft: #fde8e8;
    --warn: #d97706;
    --warn-soft: #fff4e0;
    --sidebar-w: 220px;
    --radius: 10px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-size: 15px; }
  a { color: var(--accent); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; background: var(--bg); padding: 0 4px; border-radius: 4px; }

  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  .brand { padding: 18px 18px 10px; display: flex; align-items: baseline; gap: 8px; }
  .brand-name { font-weight: 700; font-size: 17px; }
  .brand-version { color: var(--muted); font-size: 12px; }
  .nav { display: flex; flex-direction: column; padding: 6px 10px; gap: 2px; }
  .nav a {
    display: block; padding: 9px 12px; border-radius: 8px; text-decoration: none;
    color: var(--text); font-size: 14px;
  }
  .nav a:hover { background: var(--bg); }
  .nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .sidebar-footer { margin-top: auto; padding: 14px 18px; border-top: 1px solid var(--border); }
  .owner { font-size: 12px; color: var(--muted); word-break: break-all; }

  .main { flex: 1; padding: 28px 32px; max-width: 1100px; }
  .page-title { margin: 0 0 6px; font-size: 22px; }
  .page-desc { margin: 0 0 20px; color: var(--muted); }
  .loading { color: var(--muted); padding: 40px 0; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .card-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .card-value { font-size: 15px; word-break: break-all; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 18px; }
  .panel h3 { margin: 0 0 10px; font-size: 15px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .toolbar .hint { color: var(--muted); font-size: 13px; margin-left: auto; }

  button {
    font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.55; cursor: progress; }

  .checks { list-style: none; margin: 0; padding: 0; }
  .check { display: flex; gap: 12px; padding: 10px 6px; border-top: 1px solid var(--border); align-items: flex-start; }
  .check:first-child { border-top: 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; flex: 0 0 12px; }
  .status-ok .dot { background: var(--ok); }
  .status-fail .dot { background: var(--fail); }
  .status-warn .dot { background: var(--warn); }
  .check-body { flex: 1; }
  .check-label { font-weight: 600; }
  .check-detail { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: pre-wrap; }

  .summary { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .summary.ok { background: var(--ok-soft); color: var(--ok); }
  .summary.fail { background: var(--fail-soft); color: var(--fail); }

  /* 表單 */
  input, select, textarea {
    font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); color: var(--text); width: 100%;
  }
  input[type="checkbox"] { width: auto; }
  textarea { resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px 18px; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field-label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .field-hint { font-size: 12px; color: var(--muted); }
  .checkbox { display: flex; align-items: center; gap: 6px; font-size: 14px; padding: 7px 0; }
  .key-row { display: flex; gap: 8px; }
  .key-row input { flex: 1; }
  button.small { padding: 4px 10px; font-size: 13px; }
  button.danger { color: var(--fail); }

  /* 表格 */
  .table-wrap { overflow-x: auto; }
  .table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .table th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .table td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .table .actions { white-space: nowrap; text-align: right; }
  .table .actions button { margin-left: 4px; }
  .table .dot.on { background: var(--ok); }
  .table .dot.off { background: var(--border); }
  .table .dot { display: inline-block; margin-top: 0; }
  .disabled-row td { color: var(--muted); }
  .row-detail td { background: var(--bg); font-size: 13px; }
  .row-detail .error { display: inline-block; margin-top: 6px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; }
  .warn-text { color: var(--warn); font-size: 13px; }
  .loading-inline { color: var(--muted); }
  .meta { color: var(--muted); font-size: 12px; white-space: pre-wrap; }

  /* 聊天台 */
  .toolbar select { width: auto; max-width: 480px; }
  .system-box { margin-bottom: 12px; }
  .system-box summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .chat-log { display: flex; flex-direction: column; gap: 10px; min-height: 120px; max-height: 60vh; overflow-y: auto; padding: 4px 2px 12px; }
  .bubble { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .bubble.user { align-self: flex-end; background: var(--accent-soft); }
  .bubble.assistant { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); }
  .bubble.pending { color: var(--muted); }
  .bubble .meta { margin-top: 6px; }
  .bubble .error { white-space: pre-wrap; }
  .chat-input { display: flex; gap: 8px; align-items: flex-end; border-top: 1px solid var(--border); padding-top: 12px; }
  .chat-input textarea { flex: 1; font-family: inherit; font-size: 14px; }

  .placeholder { padding: 28px; border: 1px dashed var(--border); border-radius: var(--radius); color: var(--muted); background: var(--panel); }
  .error { background: var(--fail-soft); color: var(--fail); padding: 10px 14px; border-radius: 8px; white-space: pre-wrap; }


  /* M2：工具步驗、工具分頁、審批、AuditLog */
  .steps { margin-bottom: 8px; font-size: 13px; }
  .steps summary { cursor: pointer; color: var(--muted); }
  .step-list { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
  .step { border-left: 3px solid var(--border); padding: 4px 8px; background: var(--panel); border-radius: 0 6px 6px 0; }
  .step.status-ok { border-left-color: var(--ok); }
  .step.status-error, .step.status-invalid { border-left-color: var(--fail); }
  .step.status-denied { border-left-color: var(--warn); }
  .step.status-pending_approval { border-left-color: var(--accent); }
  .step-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .step-args { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; margin-top: 2px; }
  .step-result { font-size: 12px; white-space: pre-wrap; word-break: break-word; margin-top: 2px; max-height: 120px; overflow: auto; }
  .tool-names { display: flex; flex-wrap: wrap; gap: 4px; max-width: 420px; }
  .tool-chip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--bg); border: 1px solid var(--border); cursor: help; }
  .tool-chip.risk-W { border-color: #c7d2fe; }
  .tool-chip.risk-X { border-color: var(--warn); color: var(--warn); }
  .tool-chip.risk-D { border-color: var(--fail); color: var(--fail); }
  .approval { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .approval.pending { border-color: var(--accent); background: var(--accent-soft); }
  .approval.state-denied { opacity: 0.7; }
  .approval-args { margin: 6px 0; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow: auto; background: var(--panel); padding: 6px 8px; border-radius: 6px; }
  .approval .toolbar { margin-bottom: 0; }
  .table.audit td { font-size: 12px; vertical-align: top; }
  .audit-cell { max-width: 320px; white-space: pre-wrap; word-break: break-all; max-height: 80px; overflow: auto; display: block; }
  .audit-fail td { background: var(--fail-soft); }
  .nowrap { white-space: nowrap; }

  @media (max-width: 720px) {
    .app { flex-direction: column; }
    .sidebar { width: auto; flex: none; height: auto; position: static; }
    .nav { flex-direction: row; flex-wrap: wrap; }
    .main { padding: 18px; }
  }
</style>
