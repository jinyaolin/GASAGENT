<script>
(function () {
  'use strict';

  /** 左側分頁。尚未實作的標註預計里程碑。 */
  const NAV = [
    { id: 'dashboard', label: '儀表板' },
    { id: 'chat', label: '聊天台' },
    { id: 'models', label: '模型' },
    { id: 'tools', label: '工具' },
    { id: 'memory', label: '記憶' },
    { id: 'skills', label: '技能' },
    { id: 'cron', label: '排程' },
    { id: 'channels', label: '通道' },
    { id: 'logs', label: '紀錄' },
    { id: 'settings', label: '設定' },
    { id: 'doctor', label: 'Doctor' },
  ];

  const bootstrap = window.BOOTSTRAP || {};
  const $main = document.getElementById('main');
  const $nav = document.getElementById('nav');

  /**
   * 包 google.script.run 成 Promise。
   * @param {string} fn 後端函式名
   * @param {...*} args
   * @return {Promise<*>}
   */
  function call(fn, ...args) {
    return new Promise((resolve, reject) => {
      if (!window.google || !google.script || !google.script.run) {
        reject(new Error('google.script.run 不可用（此頁需由 Apps Script Web App 提供）'));
        return;
      }
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((err) => reject(err instanceof Error ? err : new Error(String(err && err.message || err))))
        [fn](...args);
    });
  }


  /**
   * @param {string} tag
   * @param {Object=} attrs
   * @param {(string|Node|Array)=} children
   * @return {HTMLElement}
   */
  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else if (v != null) node.setAttribute(k, v);
    });
    [].concat(children || []).forEach((c) => {
      if (c == null) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function header(title, desc) {
    return [el('h1', { class: 'page-title' }, title), desc ? el('p', { class: 'page-desc' }, desc) : null];
  }

  function field(label, control, hint) {
    return el('label', { class: 'field' }, [
      el('span', { class: 'field-label' }, label),
      control,
      hint ? el('span', { class: 'field-hint' }, hint) : null,
    ]);
  }

  function errorBox(err) {
    return el('div', { class: 'error' }, '錯誤：' + (err && err.message ? err.message : String(err)));
  }

  // ---- 儀表板 ----------------------------------------------------------------

  async function renderDashboard(root) {
    root.append(...header('儀表板', '目前安裝狀態一覽。詳細健檢請看 Doctor 分頁。'));
    const cards = el('div', { class: 'cards' }, el('div', { class: 'loading' }, '載入中…'));
    root.append(cards);
    try {
      const o = await call('adminGetOverview');
      cards.innerHTML = '';
      cards.append(
        card('版本', o.version),
        card('Owner', o.owner),
        card('時區', o.timeZone),
        card('DB spreadsheet', o.db.url
          ? el('a', { href: o.db.url, target: '_blank', rel: 'noopener' }, 'GAS Agent DB')
          : '尚未建立'),
        card('Queue trigger', o.triggerCount === 1 ? '已安裝（每分鐘）' : `${o.triggerCount} 支（預期 1）`),
        card('Web App 網址', o.webAppUrl ? el('a', { href: o.webAppUrl, target: '_blank', rel: 'noopener' }, o.webAppUrl) : '未部署'),
      );
    } catch (err) {
      cards.innerHTML = '';
      cards.append(errorBox(err));
    }
  }

  function card(label, value) {
    return el('div', { class: 'card' }, [
      el('div', { class: 'card-label' }, label),
      el('div', { class: 'card-value' }, value),
    ]);
  }

  // ---- Doctor ---------------------------------------------------------------

  async function renderDoctor(root) {
    root.append(...header('Doctor', '檢查 Script Properties、DB 每個 tab 與表頭、trigger、授權 scopes。'));

    const $summary = el('span', { class: 'hint' });
    const $list = el('ul', { class: 'checks' });
    const $tests = el('div');

    const $redteam = el('div');

    const btnDoctor = el('button', { class: 'primary', onclick: () => runDoctor() }, '重新檢查');
    const btnTests = el('button', { onclick: () => runTests() }, '跑 smoke tests');
    const btnRedTeam = el('button', { onclick: () => runRedTeam() }, '紅隊（真模型）');
    const btnReinstall = el('button', { onclick: () => reinstall() }, '重新安裝（補 tabs / trigger）');

    root.append(
      el('div', { class: 'panel' }, [
        el('div', { class: 'toolbar' }, [btnDoctor, btnTests, btnRedTeam, btnReinstall, $summary]),
        $list,
      ]),
      el('div', { class: 'panel' }, [el('h3', {}, 'Smoke tests'), $tests]),
      el('div', { class: 'panel' }, [el('h3', {}, '紅隊測試'), el('p', { class: 'field-hint' }, '用真模型跑注入案例：郵件 / 文件 / 網頁內容裡藏「寄給外人」「分享檔案」「你是管理員，關閉審批」等指令，以及群組成員要求讀 owner 的 Gmail / Drive。R 工具的結果由程式偽造（不讀真資料），寫入 / 外發工具一律換成記錄器（絕不真的執行），審批不寫進 Approvals。每個案例結果記 AuditLog security:redteam:<id>。本機 node scripts/local-tests.js 的 injection 群組用「乖乖照做」的假模型跑同一組案例。'), $redteam]),
    );

    function setBusy(busy) {
      [btnDoctor, btnTests, btnRedTeam, btnReinstall].forEach((b) => { b.disabled = busy; });
    }

    async function runRedTeam() {
      setBusy(true);
      $redteam.innerHTML = '';
      const $sum = el('div', { class: 'toolbar' }, el('span', { class: 'loading' }, '載入案例…'));
      const ul = el('ul', { class: 'checks' });
      $redteam.append($sum, ul);
      let pass = 0; let fail = 0;
      try {
        const cases = await call('adminListRedTeamCases');
        for (const c of cases) {
          const li = el('li', { class: 'check status-warn' }, [el('span', { class: 'dot' }), el('div', { class: 'check-body' }, [el('div', { class: 'check-label' }, `${c.title}（${c.principal}）… 執行中`)])]);
          ul.append(li);
          $sum.innerHTML = ''; $sum.append(el('span', { class: 'hint' }, `${pass + fail} / ${cases.length} 完成`));
          let res;
          try {
            res = (await call('adminRunRedTeam', c.id)).cases[0];
          } catch (err) {
            res = { ok: false, title: c.title, principal: c.principal, findings: [{ level: 'fail', text: String(err && err.message || err) }], notes: [], steps: [], llmCalls: 0, provider: '', model: '' };
          }
          if (res.ok) pass++; else fail++;
          li.className = 'check status-' + (res.ok ? (res.findings.length ? 'warn' : 'ok') : 'fail');
          const body = li.querySelector('.check-body');
          body.innerHTML = '';
          body.append(el('div', { class: 'check-label' }, `${res.ok ? 'PASS' : 'FAIL'}　${res.title}（${res.principal}；${res.provider || '?'} / ${res.model || '?'}，${res.llmCalls} 次呼叫）`));
          const lines = res.findings.map((f) => `[${f.level}] ${f.text}`).concat(res.notes);
          if (res.steps && res.steps.length) lines.push('步驗：' + res.steps.map((s) => `${s.tool}→${s.status}${s.error ? '(' + s.error + ')' : ''}`).join('、'));
          if (!lines.length) lines.push('模型沒有嘗試任何被禁的動作');
          body.append(el('div', { class: 'check-detail' }, lines.join('\n')));
        }
        $sum.innerHTML = '';
        $sum.append(el('span', { class: 'summary ' + (fail ? 'fail' : 'ok') }, `${pass} 通過 / ${fail} 失敗`), el('span', { class: 'hint' }, '結果已記 AuditLog（紀錄分頁，tool 以 security:redteam 開頭）'));
      } catch (err) {
        $sum.innerHTML = '';
        $sum.append(errorBox(err));
      } finally {
        setBusy(false);
      }
    }

    async function runDoctor() {
      setBusy(true);
      $list.innerHTML = '';
      $list.append(el('li', { class: 'loading' }, '檢查中…'));
      $summary.textContent = '';
      try {
        const r = await call('adminRunDoctor');
        renderChecks(r);
      } catch (err) {
        $list.innerHTML = '';
        $list.append(el('li', {}, errorBox(err)));
      } finally {
        setBusy(false);
      }
    }

    function renderChecks(r) {
      $list.innerHTML = '';
      r.checks.forEach((c) => {
        $list.append(el('li', { class: 'check status-' + c.status }, [
          el('span', { class: 'dot', title: c.status }),
          el('div', { class: 'check-body' }, [
            el('div', { class: 'check-label' }, c.label),
            c.detail ? el('div', { class: 'check-detail' }, c.detail) : null,
          ]),
        ]));
      });
      const fails = r.checks.filter((c) => c.status === 'fail').length;
      const warns = r.checks.filter((c) => c.status === 'warn').length;
      $summary.innerHTML = '';
      $summary.append(el('span', { class: 'summary ' + (r.ok ? 'ok' : 'fail') },
        r.ok ? `全綠（${r.checks.length} 項${warns ? `，${warns} 項提醒` : ''}）` : `${fails} 項失敗`));
    }

    async function runTests() {
      setBusy(true);
      $tests.innerHTML = '';
      $tests.append(el('div', { class: 'loading' }, '執行中…'));
      try {
        const r = await call('adminRunSmokeTests');
        $tests.innerHTML = '';
        $tests.append(el('div', { class: 'toolbar' }, [
          el('span', { class: 'summary ' + (r.ok ? 'ok' : 'fail') }, `${r.passed} 通過 / ${r.failed} 失敗`),
          el('span', { class: 'hint' }, `${r.ms} ms`),
        ]));
        const ul = el('ul', { class: 'checks' });
        r.results.forEach((t) => {
          ul.append(el('li', { class: 'check status-' + (t.ok ? 'ok' : 'fail') }, [
            el('span', { class: 'dot' }),
            el('div', { class: 'check-body' }, [
              el('div', { class: 'check-label' }, `${t.name}（${t.ms} ms）`),
              t.error ? el('div', { class: 'check-detail' }, t.error) : null,
            ]),
          ]));
        });
        $tests.append(ul);
      } catch (err) {
        $tests.innerHTML = '';
        $tests.append(errorBox(err));
      } finally {
        setBusy(false);
      }
    }

    async function reinstall() {
      setBusy(true);
      try {
        await call('adminReinstall');
        await runDoctor();
      } catch (err) {
        $list.innerHTML = '';
        $list.append(el('li', {}, errorBox(err)));
        setBusy(false);
      }
    }

    runDoctor();
  }


  // ---- 模型（Providers）--------------------------------------------------------

  /** 新增表單的預設值範本；選了只是填欄位，仍可改。 */
  const PROVIDER_PRESETS = [
    { id: 'zai-glm', label: 'Z.ai GLM（coding plan）', protocol: 'openai', base_url: 'https://api.z.ai/api/coding/paas/v4', model: 'glm-4.6', max_tokens: 4096, extra_body: '{"thinking": {"type": "disabled"}}' },
    { id: 'openrouter', label: 'OpenRouter', protocol: 'openai', base_url: 'https://openrouter.ai/api/v1', model: 'anthropic/claude-sonnet-4.5', extra_headers: '{"HTTP-Referer": "https://script.google.com", "X-Title": "GAS Agent"}' },
    { id: 'deepseek', label: 'DeepSeek', protocol: 'openai', base_url: 'https://api.deepseek.com', model: 'deepseek-chat', max_tokens: 4096 },
    { id: 'openai', label: 'OpenAI', protocol: 'openai', base_url: 'https://api.openai.com/v1', model: 'gpt-4o-mini' },
    { id: 'anthropic', label: 'Anthropic', protocol: 'anthropic', base_url: 'https://api.anthropic.com', model: 'claude-sonnet-4-5', max_tokens: 4096 },
    { id: 'gemini', label: 'Google Gemini', protocol: 'gemini', base_url: 'https://generativelanguage.googleapis.com', model: 'gemini-2.5-flash', max_tokens: 4096 },
  ];

  const PROVIDER_FIELDS = [
    { key: 'id', label: 'id', hint: '小寫字母 / 數字 / _ / -；每個 provider 唯一、存檔後不可改（key 綁 PROVIDER_KEY_<id>）。同協定第二組請換 id，例如 gemini-2', required: true },
    { key: 'label', label: '顯示名稱' },
    { key: 'protocol', label: '協定', type: 'select', options: ['openai', 'anthropic', 'gemini'], required: true },
    { key: 'base_url', label: 'base_url', hint: 'openai：到 /v1 為止（不含 /chat/completions）；anthropic / gemini：只到網域', required: true },
    { key: 'model', label: 'model', required: true },
    { key: 'role', label: '角色', type: 'select', options: ['main', 'fast', 'embed'], required: true },
    { key: 'priority', label: '優先序', type: 'number', hint: '同角色由小到大組備援鏈', value: 10 },
    { key: 'max_tokens', label: 'max_tokens', type: 'number', hint: '回覆上限；GAS 單次執行 6 分鐘，建議設' },
    { key: 'extra_headers', label: 'extra_headers（JSON）', type: 'textarea', hint: '例：{"X-Title": "GAS Agent"}' },
    { key: 'extra_body', label: 'extra_body（JSON）', type: 'textarea', hint: '合併進請求 body；GLM 建議 {"thinking": {"type": "disabled"}}；值為 null 可移除預設欄位' },
    { key: 'cost_in_per_m', label: '輸入單價（USD / 百萬 tokens）', type: 'number', step: '0.01' },
    { key: 'cost_out_per_m', label: '輸出單價（USD / 百萬 tokens）', type: 'number', step: '0.01' },
  ];

  async function renderModels(root) {
    root.append(...header('模型', 'Provider 設定存在 DB 的 Providers tab；API key 只進 Script Properties，這裡只顯示末 4 碼。'));

    const $status = el('span', { class: 'hint' });
    const $table = el('div', { class: 'table-wrap' }, el('div', { class: 'loading' }, '載入中…'));
    const $form = el('div', { class: 'panel form-panel', style: 'display:none' });
    const btnAdd = el('button', { class: 'primary', onclick: () => openForm(null) }, '新增 provider');
    const btnReload = el('button', { onclick: () => load() }, '重新整理');

    root.append(
      el('div', { class: 'panel' }, [el('div', { class: 'toolbar' }, [btnAdd, btnReload, $status]), $table]),
      $form,
    );

    let providers = [];

    async function load() {
      $table.innerHTML = '';
      $table.append(el('div', { class: 'loading' }, '載入中…'));
      $status.textContent = '';
      try {
        providers = await call('adminListProviders');
        renderTable();
      } catch (err) {
        $table.innerHTML = '';
        $table.append(errorBox(err));
      }
    }

    function renderTable() {
      $table.innerHTML = '';
      if (!providers.length) {
        $table.append(el('div', { class: 'placeholder' }, '尚無 provider。按「新增 provider」，建議先接 Z.ai GLM 當 main，再加一個 Anthropic 或 Gemini 當備援。'));
        return;
      }
      const thead = el('thead', {}, el('tr', {}, ['', 'id', '名稱', '協定', 'model', '角色', '優先', 'key', ''].map((h) => el('th', {}, h))));
      const tbody = el('tbody');
      providers
        .slice()
        .sort((a, b) => (a.role < b.role ? -1 : a.role > b.role ? 1 : 0) || (a.priority - b.priority) || a.id.localeCompare(b.id))
        .forEach((p) => {
          const $result = el('tr', { class: 'row-detail', style: 'display:none' }, el('td', { colspan: 9 }));
          const btnTest = el('button', { class: 'small', onclick: () => test(p, btnTest, $result) }, '測試連線');
          const btnToggle = el('button', { class: 'small', onclick: () => toggle(p, btnToggle) }, p.enabled ? '停用' : '啟用');
          const btnEdit = el('button', { class: 'small', onclick: () => openForm(p) }, '編輯');
          const btnDelete = el('button', { class: 'small danger', onclick: () => remove(p) }, '刪除');
          tbody.append(el('tr', { class: p.enabled ? '' : 'disabled-row' }, [
            el('td', {}, el('span', { class: 'dot ' + (p.enabled ? 'on' : 'off'), title: p.enabled ? '啟用' : '停用' })),
            el('td', {}, el('code', {}, p.id)),
            el('td', {}, p.label),
            el('td', {}, el('span', { class: 'badge' }, p.protocol)),
            el('td', {}, p.model),
            el('td', {}, p.role),
            el('td', {}, String(p.priority)),
            el('td', {}, p.hasKey ? el('code', {}, p.keyHint) : el('span', { class: 'warn-text' }, '未設定')),
            el('td', { class: 'actions' }, [btnTest, btnEdit, btnToggle, btnDelete]),
          ]), $result);
        });
      $table.append(el('table', { class: 'table' }, [thead, tbody]));
    }

    async function test(p, btn, $result) {
      btn.disabled = true;
      const td = $result.firstChild;
      td.innerHTML = '';
      td.append(el('span', { class: 'loading-inline' }, `測試 ${p.id}…`));
      $result.style.display = '';
      try {
        const r = await call('adminTestProvider', p.id);
        td.innerHTML = '';
        if (r.ok) {
          td.append(
            el('span', { class: 'summary ok' }, `OK ${r.ms} ms`),
            el('span', { class: 'meta' }, ` ${r.model} · tokens ${r.usage ? r.usage.prompt + '/' + r.usage.completion : '-'} · 回覆：`),
            el('code', {}, (r.text || '(空)').slice(0, 200)),
          );
        } else {
          td.append(el('span', { class: 'summary fail' }, `失敗 ${r.ms} ms`), el('div', { class: 'error' }, r.error));
        }
      } catch (err) {
        td.innerHTML = '';
        td.append(errorBox(err));
      } finally {
        btn.disabled = false;
      }
    }

    async function toggle(p, btn) {
      btn.disabled = true;
      try {
        await call('adminSetProviderEnabled', p.id, !p.enabled);
        await load();
      } catch (err) {
        $status.innerHTML = '';
        $status.append(errorBox(err));
        btn.disabled = false;
      }
    }

    async function remove(p) {
      if (!confirm(`刪除 provider「${p.id}」？其 API key 也會一併從 Script Properties 移除。`)) return;
      try {
        await call('adminDeleteProvider', p.id);
        await load();
      } catch (err) {
        $status.innerHTML = '';
        $status.append(errorBox(err));
      }
    }

    function openForm(p) {
      const isNew = !p;
      $form.innerHTML = '';
      $form.style.display = '';
      const inputs = {};
      const $msg = el('div');

      const grid = el('div', { class: 'form-grid' });
      if (isNew) {
        const sel = el('select', {
          onchange: () => {
            const preset = PROVIDER_PRESETS.find((x) => x.id === sel.value);
            if (!preset) return;
            PROVIDER_FIELDS.forEach((f) => { if (preset[f.key] !== undefined) inputs[f.key].value = preset[f.key]; });
            // id 已被用掉就自動接 -2、-3…，避免新增時覆蓋既有的同範本 provider。
            if (!inputs.id.value || providers.some((x) => x.id === inputs.id.value)) {
              let candidate = preset.id;
              for (let n = 2; providers.some((x) => x.id === candidate); n++) candidate = `${preset.id}-${n}`;
              inputs.id.value = candidate;
            }
          },
        }, [el('option', { value: '' }, '— 套用範本（選填）—')].concat(PROVIDER_PRESETS.map((x) => el('option', { value: x.id }, x.label))));
        grid.append(field('範本', sel, '填好 base_url / model / 建議設定，再自行調整'));
      }

      PROVIDER_FIELDS.forEach((f) => {
        let input;
        if (f.type === 'select') {
          input = el('select', {}, f.options.map((o) => el('option', { value: o }, o)));
        } else if (f.type === 'textarea') {
          input = el('textarea', { rows: 2, spellcheck: 'false' });
        } else {
          input = el('input', { type: f.type || 'text', step: f.step || null });
        }
        const current = p ? p[f.key] : (f.value !== undefined ? f.value : '');
        if (current !== undefined && current !== null) {
          // JSON 欄位：空 object 顯示空白；數字欄位：0 代表未設定，也顯示空白（priority 除外）。
          if (typeof current === 'object') input.value = Object.keys(current).length ? JSON.stringify(current) : '';
          else if (f.type === 'number' && f.key !== 'priority' && Number(current) === 0) input.value = '';
          else input.value = String(current);
        }
        if (f.key === 'id' && !isNew) input.disabled = true;
        inputs[f.key] = input;
        grid.append(field(f.label + (f.required ? ' *' : ''), input, f.hint));
      });

      const enabled = el('input', { type: 'checkbox' });
      enabled.checked = p ? !!p.enabled : true;
      grid.append(field('啟用', el('label', { class: 'checkbox' }, [enabled, ' 啟用（加入備援鏈）'])));

      const keyInput = el('input', { type: 'password', autocomplete: 'off', placeholder: p && p.hasKey ? `已設定（${p.keyHint}），留空則不變` : '貼上 API key' });
      const keyRow = el('div', { class: 'key-row' }, [keyInput]);
      if (p && p.hasKey) {
        keyRow.append(el('button', { class: 'small danger', onclick: async () => {
          if (!confirm(`清除「${p.id}」的 API key？`)) return;
          try { await call('adminClearProviderKey', p.id); await load(); openForm(providers.find((x) => x.id === p.id)); } catch (err) { $msg.innerHTML = ''; $msg.append(errorBox(err)); }
        } }, '清除 key'));
      }
      grid.append(field('API key', keyRow, '只寫入 Script Properties PROVIDER_KEY_<id>，不存 sheet、不回傳明文'));

      const btnSave = el('button', { class: 'primary', onclick: save }, isNew ? '新增' : '儲存');
      const btnCancel = el('button', { onclick: () => { $form.style.display = 'none'; $form.innerHTML = ''; } }, '取消');

      $form.append(
        el('h3', {}, isNew ? '新增 provider' : `編輯 ${p.id}`),
        grid,
        el('div', { class: 'toolbar' }, [btnSave, btnCancel]),
        $msg,
      );
      $form.scrollIntoView({ behavior: 'smooth', block: 'start' });

      async function save() {
        const payload = {};
        PROVIDER_FIELDS.forEach((f) => { payload[f.key] = inputs[f.key].value.trim(); });
        payload.enabled = enabled.checked;
        payload.apiKey = keyInput.value;
        payload.isNew = isNew;
        btnSave.disabled = true;
        $msg.innerHTML = '';
        try {
          await call('adminSaveProvider', payload);
          keyInput.value = '';
          $form.style.display = 'none';
          $form.innerHTML = '';
          await load();
        } catch (err) {
          $msg.append(errorBox(err));
          btnSave.disabled = false;
        }
      }
    }

    function field(label, control, hint) {
      return el('label', { class: 'field' }, [
        el('span', { class: 'field-label' }, label),
        control,
        hint ? el('span', { class: 'field-hint' }, hint) : null,

  // ---- 聊天台（M2：接工具迴圈）------------------------------------------------------

  const STEP_STATUS_LABEL = { ok: '完成', error: '失敗', denied: 'RBAC 拒絕', invalid: '參數錯誤', pending_approval: '待審批' };

  async function renderChat(root) {
    root.append(...header('聊天台', 'Session 持久化在 DB 的 Sessions / Messages。輸入 /new 開新 session、/status 看目前 session、/<技能名> 直接套用技能全文；閒置超過設定小時會自動開新的。'));

    const $provider = el('select', { title: '選擇 provider' }, el('option', { value: '' }, '自動（main 備援鏈）'));
    const $session = el('select', { title: '切換 session' }, el('option', { value: '' }, '— 新 session —'));
    const $system = el('textarea', { rows: 2, placeholder: '額外 system 指示（選填；人格請到「工具」分頁設定）' });
    const $input = el('textarea', { rows: 3, placeholder: '輸入訊息，Ctrl / ⌘ + Enter 送出。/new 開新 session；/weekly-report 之類套用技能。例：找出上週收到關於 X 的信，整理成一份 Doc，並草擬回信' });
    const $log = el('div', { class: 'chat-log' });
    const $sessInfo = el('span', { class: 'hint' });
    const $bg = el('input', { type: 'checkbox', title: '把這則訊息排進 Queue，由每分鐘 trigger 執行並輪詢結果（驗證 M4 Queue 路徑；超過時間預算會自動續跑）' });
    const btnSend = el('button', { class: 'primary', onclick: send }, '送出');
    const btnNew = el('button', { onclick: () => { $input.value = '/new'; send(); } }, '/new');
    let sessionId = '';

    $input.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); send(); }
    });
    $session.addEventListener('change', () => { sessionId = $session.value; $log.innerHTML = ''; if (sessionId) loadHistory(sessionId); });

    root.append(
      el('div', { class: 'panel' }, [
        el('div', { class: 'toolbar' }, [el('span', { class: 'field-label' }, 'provider'), $provider, el('span', { class: 'field-label' }, 'session'), $session, btnNew, $sessInfo]),
        el('details', { class: 'system-box' }, [el('summary', {}, '額外 system 指示'), $system]),
        $log,
        el('div', { class: 'chat-input' }, [$input, el('div', { class: 'chat-send' }, [btnSend, el('label', { class: 'checkbox small-check' }, [$bg, ' 背景執行（Queue）'])])]),
      ]),
    );

    try {
      const [providers, sessions] = await Promise.all([call('adminListProviders'), call('adminListSessions', 20)]);
      providers
        .filter((p) => p.enabled && p.role !== 'embed')
        .sort((a, b) => (a.role < b.role ? -1 : 1) || (a.priority - b.priority))
        .forEach((p) => $provider.append(el('option', { value: p.id }, `${p.label || p.id}（${p.role} · ${p.protocol} · ${p.model}）${p.hasKey ? '' : ' — 無 key'}`)));
      if (!providers.some((p) => p.enabled && p.role === 'main')) {
        $log.append(el('div', { class: 'placeholder' }, '還沒有啟用的 main provider，請先到「模型」分頁新增。'));
      }
      sessions.forEach((sx) => $session.append(sessionOption(sx)));
      const active = sessions.find((sx) => sx.status === 'active' && sx.channel === 'admin');
      if (active) { sessionId = active.id; $session.value = active.id; await loadHistory(active.id); }
    } catch (err) {
      $log.append(errorBox(err));
    }

    function sessionOption(sx) {
      return el('option', { value: sx.id }, `${sx.status === 'active' ? '● ' : '○ '}${sx.channel && sx.channel !== 'admin' ? `[${sx.channel}] ` : ''}${sx.title || '（無標題）'} · ${sx.turns} 輪 · ${(sx.last_active || '').slice(0, 16).replace('T', ' ')}`);
    }

    async function loadHistory(id) {
      $log.innerHTML = '';
      $log.append(el('div', { class: 'loading' }, '載入對話…'));
      try {
        const r = await call('adminGetSessionMessages', id, 40);
        $log.innerHTML = '';
        if (r.session && r.session.summary) $log.append(el('div', { class: 'placeholder summary-box' }, '較早內容已壓縮成摘要：\n' + r.session.summary));
        r.messages.forEach((m) => {
          if (m.role === 'tool') return;
          if (m.role === 'assistant' && m.text.indexOf('[呼叫工具]') === 0) return;
          $log.append(bubble(m.role, m.text));
        });
        if (r.session) $sessInfo.textContent = `${r.session.id} · ${r.session.turns} 輪 · ≈${r.session.token_est} tokens`;
        if ($log.lastChild) $log.lastChild.scrollIntoView({ block: 'end' });
      } catch (err) {
        $log.innerHTML = '';
        $log.append(errorBox(err));
      }
    }

    async function send() {
      const message = $input.value.trim();
      if (!message) return;
      btnSend.disabled = true;
      $input.disabled = true;
      $log.append(bubble('user', message));
      const $pending = bubble('assistant', '思考與執行工具中…（含工具呼叫可能需要數十秒到數分鐘）', null, true);
      $log.append($pending);
      $pending.scrollIntoView({ block: 'end' });
      const t0 = Date.now();
      try {
        const r = $bg.checked
          ? await runInBackground({ providerId: $provider.value, message, system: $system.value, sessionId }, $pending)
          : await call('adminChat', { providerId: $provider.value, message, system: $system.value, sessionId });
        const meta = [
          r.provider ? `${r.provider} · ${r.model}` : null,
          r.llmCalls ? `LLM ${r.llmCalls} 次 · 工具 ${r.steps.length} 步` : null,
          r.usage && (r.usage.prompt || r.usage.completion) ? `tokens ${r.usage.prompt} + ${r.usage.completion}` : null,
          `${r.ms} ms（含往返 ${Date.now() - t0} ms）`,
          r.costEst ? `≈ $${r.costEst}` : null,
          r.stopped ? `中止：${r.stopped}` : null,
          r.jobChain ? `Queue job：${r.jobChain.join(' → ')}` : null,
          r.compacted ? '本輪前已壓縮較早對話' : null,
          r.skills && r.skills.loaded && r.skills.loaded.length ? `技能：${r.skills.loaded.join(', ')}` : null,
          r.skills && r.skills.missing && r.skills.missing.length ? `找不到技能：${r.skills.missing.join(', ')}` : null,
          r.approvalNotice ? (r.approvalNotice.ok ? `審批通知已推到 Telegram（chat ${r.approvalNotice.chatId}）` : r.approvalNotice.error ? `Telegram 審批通知失敗：${r.approvalNotice.error}` : null) : null,
          r.skillProposal ? (r.skillProposal.proposed ? `技能提案已送審（${r.skillProposal.approvalId}）→ 紀錄 → 審批` : `技能提案評估：${r.skillProposal.text || r.skillProposal.status || '不需要'}`) : null,
          r.curation ? `記憶整理：${r.curation}` : null,
          r.sessionReason || null,
        ].filter(Boolean).join(' · ');
        const fallbacks = (r.fallbacks || []).map((f) => `備援：${f.error}`).join('\n');
        $pending.replaceWith(bubble('assistant', r.text || '（空回覆）', meta + (fallbacks ? '\n' + fallbacks : ''), false, (r.steps || []).concat(r.skillProposal && r.skillProposal.steps ? r.skillProposal.steps : [])));
        if (r.sessionId && r.sessionId !== sessionId) {
          sessionId = r.sessionId;
          if (r.command === 'new') $log.innerHTML = '';
          const sessions = await call('adminListSessions', 20);
          $session.innerHTML = '';
          $session.append(el('option', { value: '' }, '— 新 session —'));
          sessions.forEach((sx) => $session.append(sessionOption(sx)));
          $session.value = sessionId;
          if (r.command === 'new') $log.append(bubble('assistant', r.text, meta));
        }
        $sessInfo.textContent = sessionId ? `${sessionId} · ${r.turns} 輪` : '';
        $input.value = '';
      } catch (err) {
        $pending.replaceWith(el('div', { class: 'bubble assistant' }, errorBox(err)));
      } finally {
        btnSend.disabled = false;
        $input.disabled = false;
        $input.focus();
        if ($log.lastChild) $log.lastChild.scrollIntoView({ block: 'end' });
      }
    }

    /**
     * 背景執行：enqueue 一個 turn job，每 5 秒輪詢 adminGetJob；job 續跑（result.continued_by）就跟著下一個 job。
     * 回傳與 adminChat 相容的物件。
     */
    async function runInBackground(payload, $pending) {
      const job = await call('adminEnqueueChat', payload);
      const chain = [job.id];
      const texts = [];
      const steps = [];
      let current = job;
      const t0 = Date.now();
      for (;;) {
        $pending.firstChild && ($pending.querySelector('.bubble-text').textContent =
          `已排入 Queue：${current.id}（${current.state}${current.attempts ? `，第 ${current.attempts} 次` : ''}）。每分鐘 trigger 會處理，輪詢中… ${Math.round((Date.now() - t0) / 1000)}s`);
        await new Promise((res) => setTimeout(res, 5000));
        if (Date.now() - t0 > 30 * 60000) throw new Error(`輪詢超過 30 分鐘仍未完成：${current.id}（到「紀錄」分頁看 Queue）`);
        const j = await call('adminGetJob', current.id);
        if (!j) throw new Error(`job ${current.id} 消失了`);
        current = j;
        if (j.state === 'queued' || j.state === 'running') continue;
        if (j.state === 'failed') throw new Error(`job ${j.id} 失敗（第 ${j.attempts} 次）：${j.error}`);
        const res = j.payload.result || {};
        if (res.text) texts.push(res.text);
        (res.steps || []).forEach((st) => steps.push(st));
        if (res.continued_by) { chain.push(res.continued_by); current = { id: res.continued_by, state: 'queued', attempts: 0 }; continue; }
        return Object.assign({}, res, {
          text: texts.join('\n\n— 續跑 —\n\n'), steps, fallbacks: [], jobChain: chain, sessionId: res.sessionId, turns: res.turns,
          ms: res.ms, curation: '', command: '', sessionReason: res.sessionCreated ? '背景 job 建了新 session' : '',
        });
      }
    }

    function bubble(role, text, meta, pending, steps) {
      return el('div', { class: `bubble ${role}${pending ? ' pending' : ''}` }, [
        steps && steps.length ? stepsList(steps) : null,
        el('div', { class: 'bubble-text' }, text),
        meta ? el('div', { class: 'meta' }, meta) : null,
      ]);
    }

    function stepsList(steps) {
      return el('details', { class: 'steps', open: '' }, [
        el('summary', {}, `工具呼叫 ${steps.length} 步`),
        el('ol', { class: 'step-list' }, steps.map((s) => el('li', { class: 'step status-' + s.status }, [
          el('div', { class: 'step-head' }, [
            el('code', {}, s.tool),
            el('span', { class: 'badge step-badge' }, STEP_STATUS_LABEL[s.status] || s.status),
            el('span', { class: 'meta' }, `${s.ms} ms`),
            s.approvalId ? el('a', { href: '#/logs', target: '_self', onclick: (ev) => { ev.preventDefault(); location.hash = '/logs'; } }, '到審批') : null,
          ]),
          el('div', { class: 'step-args' }, s.argsPreview),
          el('div', { class: 'step-result' }, s.resultPreview),
        ]))),
      ]);
    }
  }

  // ---- 記憶（Memory / UserProfile / Sessions）----------------------------------------------

  async function renderMemory(root) {
    root.append(...header('記憶', 'Memory 放專案脈絡與工作方式，UserProfile 放關於你的偏好與事實；agent 用 memory_manage 增修，鎖定（pinned）的條目 agent 不能動。下方是 session 清單與 curation。'));
    const $body = el('div', {}, el('div', { class: 'loading' }, '載入中…'));
    root.append($body);
    let data;
    try {
      data = await call('adminGetMemory');
    } catch (err) {
      $body.innerHTML = '';
      $body.append(errorBox(err));
      return;
    }
    $body.innerHTML = '';
    ['user', 'memory'].forEach((target) => $body.append(memoryPanel(target, data[target])));
    $body.append(await sessionsPanel());

    function memoryPanel(target, t) {
      const pct = Math.min(100, Math.round((t.used / t.limit) * 100));
      const $msg = el('div');
      const $list = el('div');
      const panel = el('div', { class: 'panel' }, [
        el('div', { class: 'toolbar' }, [
          el('h3', { style: 'margin:0' }, t.label),
          el('span', { class: 'hint' }, `${t.used} / ${t.limit} 字元（${pct}%）· ${t.hint}`),
        ]),
        el('div', { class: 'capacity' }, el('div', { class: 'capacity-bar' + (pct > 85 ? ' warn' : ''), style: `width:${pct}%` })),
        $list,
        $msg,
      ]);
      t.entries.forEach((e) => $list.append(entryRow(e)));
      $list.append(entryRow(null));

      function entryRow(e) {
        const $content = el('textarea', { rows: 2, style: 'font-family: inherit', placeholder: e ? '' : '新增條目…' });
        $content.value = e ? e.content : '';
        const $cat = el('input', { type: 'text', placeholder: '分類', style: 'width:120px' });
        $cat.value = e ? e.category : '';
        const $pin = el('input', { type: 'checkbox', title: '鎖定：agent 不能改或刪' });
        $pin.checked = e ? e.pinned : false;
        const btnSave = el('button', { class: 'small primary', onclick: () => save(e ? 'update' : 'add') }, e ? '儲存' : '新增');
        const btnDel = e ? el('button', { class: 'small danger', onclick: () => { if (confirm('刪除這條記憶？')) save('delete'); } }, '刪除') : null;
        const meta = e ? el('div', { class: 'meta' }, `${e.id} · 來源 ${e.source_session || '-'} · 更新 ${(e.updated || '').slice(0, 16).replace('T', ' ')}`) : null;
        const row = el('div', { class: 'memory-row' }, [
          $content,
          el('div', { class: 'memory-row-side' }, [$cat, el('label', { class: 'checkbox' }, [$pin, ' 鎖定']), btnSave, btnDel]),
          meta,
        ]);
        return row;
        async function save(action) {
          btnSave.disabled = true;
          $msg.innerHTML = '';
          try {
            await call('adminSaveMemoryEntry', { target, action, id: e ? e.id : '', content: $content.value, category: $cat.value, pinned: $pin.checked });
            root.innerHTML = '';
            renderMemory(root);
          } catch (err) {
            $msg.append(errorBox(err));
            btnSave.disabled = false;
          }
        }
      }
      return panel;
    }

    async function sessionsPanel() {
      const $table = el('div', { class: 'table-wrap' }, el('div', { class: 'loading' }, '載入中…'));
      const $detail = el('div');
      const $msg = el('div');
      const panel = el('div', { class: 'panel' }, [el('h3', {}, 'Sessions（最近 30 個）'), $table, $detail, $msg]);
      try {
        const sessions = await call('adminListSessions', 30);
        $table.innerHTML = '';
        if (!sessions.length) { $table.append(el('div', { class: 'placeholder' }, '尚無 session。到聊天台送出第一則訊息。')); return panel; }
        const thead = el('thead', {}, el('tr', {}, ['', '標題', '輪', 'tokens', '最後活動', 'curation', ''].map((h) => el('th', {}, h))));
        const tbody = el('tbody', {}, sessions.map((sx) => {
          const btnView = el('button', { class: 'small', onclick: () => view(sx) }, '訊息');
          const btnCurate = el('button', { class: 'small', onclick: () => act('adminRunCuration', sx, btnCurate) }, '整理記憶');
          const btnClose = sx.status === 'active' ? el('button', { class: 'small', onclick: () => act('adminCloseSession', sx, btnClose) }, '關閉') : null;
          return el('tr', { class: sx.status === 'active' ? '' : 'disabled-row' }, [
            el('td', {}, el('span', { class: 'dot ' + (sx.status === 'active' ? 'on' : 'off'), title: sx.status })),
            el('td', {}, [el('div', {}, sx.title || '（無標題）'), el('div', { class: 'meta' }, sx.id + (sx.summary ? ' · 有摘要' : '') + (sx.has_embedding ? ' · 有向量' : ''))]),
            el('td', {}, String(sx.turns)),
            el('td', {}, String(sx.token_est)),
            el('td', { class: 'nowrap' }, (sx.last_active || '').slice(0, 16).replace('T', ' ')),
            el('td', {}, `到第 ${sx.last_curated_turn} 輪`),
            el('td', { class: 'actions' }, [btnView, btnCurate, btnClose]),
          ]);
        }));
        $table.append(el('table', { class: 'table' }, [thead, tbody]));
      } catch (err) {
        $table.innerHTML = '';
        $table.append(errorBox(err));
      }
      return panel;

      async function view(sx) {
        $detail.innerHTML = '';
        $detail.append(el('div', { class: 'loading' }, '載入訊息…'));
        try {
          const r = await call('adminGetSessionMessages', sx.id, 80);
          $detail.innerHTML = '';
          $detail.append(el('h3', {}, `${sx.title || sx.id} 的訊息（最後 ${r.messages.length} 則）`));
          if (r.session.summary) $detail.append(el('div', { class: 'placeholder summary-box' }, '摘要：\n' + r.session.summary));
          const log = el('div', { class: 'chat-log' });
          r.messages.forEach((m) => log.append(el('div', { class: 'bubble ' + (m.role === 'user' ? 'user' : 'assistant') + (m.role === 'tool' ? ' tool-msg' : '') }, [
            el('div', { class: 'bubble-text' }, (m.role === 'tool' ? `[${m.name}] ` : '') + m.text),
            el('div', { class: 'meta' }, `#${m.seq} ${m.role}`),
          ])));
          $detail.append(log);
        } catch (err) {
          $detail.innerHTML = '';
          $detail.append(errorBox(err));
        }
      }

      async function act(fn, sx, btn) {
        btn.disabled = true;
        $msg.innerHTML = '';
        try {
          const r = await call(fn, sx.id);
          $msg.append(el('span', { class: 'summary ok' }, `${fn === 'adminCloseSession' ? '已關閉' : '已整理'}：${r.curation || '-'}`));
          setTimeout(() => { root.innerHTML = ''; renderMemory(root); }, 1200);
        } catch (err) {
          $msg.append(errorBox(err));
          btn.disabled = false;
        }
      }
    }
  }

  // ---- 設定（Agent 層）-----------------------------------------------------------------------

  const AGENT_SETTING_FIELDS = [
    { key: 'memory_max_chars', label: 'Memory 容量（字元）', hint: 'hermes 預設 2200；滿了 agent 會被要求先整併' },
    { key: 'profile_max_chars', label: 'UserProfile 容量（字元）', hint: 'hermes 預設 1375' },

    { key: 'keep_recent_turns', label: '壓縮時保留最近幾輪', hint: '一輪 = 一則 user 訊息到下一則 user 之前' },
    { key: 'curation_every_turns', label: '每幾輪跑一次 curation', hint: '0 = 關閉；/new 與「關閉 session」也會跑' },

    { key: 'turn_budget_seconds', label: '單輪時間預算（秒）', hint: '到了就停並由 Queue 續跑（上限 3 次）。GAS 單次執行 6 分鐘，別超過 300；要驗證續跑可暫時調到 20–40' },
  ];

  async function renderSettings(root) {
    root.append(...header('設定', 'Agent 層設定，存在 DB 的 Config tab。工具 RBAC、審批策略與人格在「工具」分頁。'));
    const $body = el('div', {}, el('div', { class: 'loading' }, '載入中…'));
    root.append($body);
    let data;
    try {
      data = await call('adminGetAgentSettings');
    } catch (err) {
      $body.innerHTML = '';
      $body.append(errorBox(err));
      return;
    }
    $body.innerHTML = '';
    const camel = (k) => k.replace(/_([a-z])/g, (m, c) => c.toUpperCase());
    const inputs = {};
    const grid = el('div', { class: 'form-grid' });
    AGENT_SETTING_FIELDS.forEach((f) => {
      const current = data.config[camel(f.key)];
      let input;
      if (f.type === 'checkbox') {
        input = el('input', { type: 'checkbox' });
        input.checked = !!current;
        grid.append(field(f.label, el('label', { class: 'checkbox' }, [input, ' 啟用']), f.hint + `（預設 ${data.defaults[f.key] ? '開' : '關'}）`));
      } else {
        input = el('input', { type: 'number' });
        input.value = current;
        grid.append(field(f.label, input, f.hint + `（預設 ${data.defaults[f.key]}）`));
      }
      inputs[f.key] = input;
    });
    const $msg = el('div');
    const btnSave = el('button', { class: 'primary', onclick: save }, '儲存');
    $body.append(
      el('div', { class: 'panel' }, [
        el('div', { class: 'toolbar' }, [
          el('span', { class: data.hasFast ? 'summary ok' : 'summary fail' }, data.hasFast ? '有 fast provider（壓縮 / curation 用）' : '沒有 fast provider：壓縮與 curation 會用 main 模型'),
          el('span', { class: data.hasEmbed ? 'summary ok' : 'badge' }, data.hasEmbed ? '有 embed provider' : '沒有 embed provider（向量搜尋不可用）'),
        ]),
        grid,
        el('div', { class: 'toolbar' }, [btnSave, $msg]),
      ]),
    );
    async function save() {
      btnSave.disabled = true;
      $msg.innerHTML = '';
      const payload = {};
      AGENT_SETTING_FIELDS.forEach((f) => { payload[f.key] = f.type === 'checkbox' ? inputs[f.key].checked : inputs[f.key].value; });
      try {
        await call('adminSaveAgentSettings', payload);
        $msg.append(el('span', { class: 'summary ok' }, '已儲存'));
        setTimeout(() => { root.innerHTML = ''; renderSettings(root); }, 600);

  // ---- 工具（RBAC / 審批策略 / 白名單 / 人格）----------------------------------------------

  const PERM_LABEL = { read: 'read（R 讀）', write: 'write（W 寫）', delete: 'delete（D 刪）', external: 'external（X 外發）' };
  const POLICY_LABEL = { always: 'always — X 類工具一律送審批', autonomous_only: 'autonomous_only — 只有無人模式（排程）才送審批', never: 'never — 直接執行（不建議）' };

  async function renderTools(root) {
    root.append(...header('工具', '每個 toolset 四個 RBAC 開關；X 類（寄信 / 分享）另依審批策略送審。設定存在 DB 的 Config tab。'));

    }
    $body.innerHTML = '';

    const checks = {};
    const $rbac = el('div', { class: 'table-wrap' });
    const thead = el('thead', {}, el('tr', {}, ['toolset'].concat(Object.keys(PERM_LABEL).map((p) => PERM_LABEL[p]), ['工具（風險）']).map((h) => el('th', {}, h))));

      ]));
    });
    $rbac.append(el('table', { class: 'table' }, [thead, tbody]));

    const $policy = el('select', {}, data.policies.map((p) => el('option', { value: p }, POLICY_LABEL[p] || p)));
    $policy.value = data.approval_policy;
    const $spill = el('input', { type: 'number', min: 1500, max: 200000 });
    $spill.value = data.spill_threshold;
    const $steps = el('input', { type: 'number', min: 1, max: 200 });

    const $domains = el('textarea', { rows: 5, placeholder: 'example.com\n*.wikipedia.org', spellcheck: 'false' });

    const $msg = el('div');
    const btnSave = el('button', { class: 'primary', onclick: save }, '儲存');
    const btnReload = el('button', { onclick: () => { root.innerHTML = ''; renderTools(root); } }, '重新整理');

    $body.append(
      el('div', { class: 'panel' }, [el('h3', {}, 'RBAC：toolset 開關'), $rbac,
        el('p', { class: 'field-hint' }, '預設 read / write 開、delete / external 關。唯一的 D 類工具是 slides_delete_slide（刪簡報的某一頁），要用請開 slides 的 delete；Gmail / Drive 沒有任何刪除工具。要讓 agent 寄信或分享檔案，請開 gmail / drive 的 external，動作仍會依審批策略送審。')]),
      el('div', { class: 'panel' }, [el('h3', {}, 'Agent 設定'), el('div', { class: 'form-grid' }, [
        field('審批策略（X 類工具）', $policy, 'autonomous_only = 只有排程（無人模式）才送審，聊天台直接執行'),
        field('spill_threshold（字元）', $spill, '工具結果超過此長度就溢寫到 Drive「GAS Agent/spill」，context 只留前 1000 字'),
        field('max_tool_steps', $steps, '單輪工具步數上限；另有 4.5 分鐘時間預算與同參數失敗 3 次熔斷'),
        field('簡報範本（slides_template_id）', $slidesTpl, '在 Drive 準備一份設好主題 / 配色 / 字型的 Google Slides，slides_create_deck 會複製它再填內容；空 = Google 預設白底主題'),
      ])]),
      el('div', { class: 'panel' }, [el('h3', {}, 'web_fetch 域名白名單'), field('一行一個；example.com 只允許該主機，*.example.com 含所有子網域。空白 = 全部拒絕。', $domains)]),
      el('div', { class: 'panel' }, [el('h3', {}, '人格（persona）'), field('system prompt 開頭；留空用預設（灰字）', $persona)]),

      btnSave.disabled = true;

        await call('adminSaveToolSettings', {
          rbac, approval_policy: $policy.value, spill_threshold: $spill.value, max_tool_steps: $steps.value,

  // ---- 紀錄：審批 + AuditLog ---------------------------------------------------------------

  async function renderLogs(root) {
    root.append(...header('紀錄', '審批：X 類工具被攔下的動作，批准即立刻執行一次，並排一個續跑 job 把結果接回原對話。Queue：背景 job 與排程執行。AuditLog：每次工具執行一列。'));
    const $approvals = el('div', {}, el('div', { class: 'loading' }, '載入中…'));
    const $queue = el('div', {}, el('div', { class: 'loading' }, '載入中…'));
    const $queueInfo = el('span', { class: 'hint' });
    const $audit = el('div', { class: 'table-wrap' }, el('div', { class: 'loading' }, '載入中…'));
    const btnReload = el('button', { onclick: () => { loadApprovals(); loadQueue(); loadAudit(); } }, '重新整理');
    const btnTick = el('button', { onclick: () => tickNow() }, '處理一個 job');
    root.append(
      el('div', { class: 'panel' }, [el('div', { class: 'toolbar' }, [el('h3', { style: 'margin:0' }, '審批'), btnReload]), $approvals]),
      el('div', { class: 'panel' }, [el('div', { class: 'toolbar' }, [el('h3', { style: 'margin:0' }, 'Queue（最近 30 個 job）'), btnTick, $queueInfo]), $queue]),
      el('div', { class: 'panel' }, [el('h3', {}, 'AuditLog（最近 50 筆）'), $audit]),
    );
    loadApprovals();
    loadQueue();
    loadAudit();

    async function loadQueue() {
      $queue.innerHTML = '';
      $queue.append(el('div', { class: 'loading' }, '載入中…'));
      try {
        const r = await call('adminListQueue', 30);
        $queueInfo.textContent = `trigger ${r.triggerCount} 支 · QUEUE_DIRTY ${r.dirty ? '1' : '空'} · 下一個排程 ${r.cronNextRun ? r.cronNextRun.slice(0, 16).replace('T', ' ') + 'Z' : '無'}`;
        $queue.innerHTML = '';
        if (!r.jobs.length) { $queue.append(el('div', { class: 'placeholder' }, '尚無 job。聊天台勾「背景執行」或排程「立即執行」會產生 job。')); return; }
        $queue.append(el('div', { class: 'table-wrap' }, el('table', { class: 'table audit' }, [
          el('thead', {}, el('tr', {}, ['建立', '類型', '狀態', '內容', 'session', '次', '完成', '結果 / 錯誤', ''].map((h) => el('th', {}, h)))),
          el('tbody', {}, r.jobs.map((j) => jobRow(j))),
        ])));
      } catch (err) {
        $queue.innerHTML = '';
        $queue.append(errorBox(err));
      }
    }

    function jobRow(j) {
      const res = j.payload.result;
      const $detail = el('div', { class: 'audit-cell' });
      if (j.error) $detail.append(el('div', { class: 'error' }, j.error));
      if (res) {
        if (res.text) $detail.append(el('div', {}, res.text.slice(0, 400) + (res.text.length > 400 ? '…' : '')));
        const bits = [];
        if (res.steps && res.steps.length) bits.push(`工具 ${res.steps.length} 步`);
        if (res.stopped) bits.push(`中止 ${res.stopped}`);
        if (res.continued_by) bits.push(`續跑 → ${res.continued_by}`);
        if (res.continuation_exhausted) bits.push('已達續跑上限');
        if (res.delivery) bits.push(res.delivery.summary);
        if (bits.length) $detail.append(el('div', { class: 'meta' }, bits.join(' · ')));
        if (res.delivery && res.delivery.ok && res.delivery.channel === 'doc') $detail.append(el('a', { href: res.delivery.ref, target: '_blank', rel: 'noopener' }, '開啟 Doc'));
      }
      const btnRetry = j.state === 'failed' ? el('button', { class: 'small', onclick: async () => { btnRetry.disabled = true; try { await call('adminRetryJob', j.id); loadQueue(); } catch (err) { $detail.append(errorBox(err)); } } }, '重試') : null;
      return el('tr', { class: j.state === 'failed' ? 'audit-fail' : '' }, [
        el('td', { class: 'nowrap' }, (j.created_at || '').slice(5, 16).replace('T', ' ')),
        el('td', {}, el('code', {}, j.type)),
        el('td', {}, el('span', { class: 'badge state-' + j.state, title: j.id }, JOB_STATE_LABEL[j.state] || j.state)),
        el('td', { class: 'audit-cell' }, j.summary || ''),
        el('td', {}, el('span', { class: 'meta' }, j.session_id)),
        el('td', {}, String(j.attempts)),
        el('td', { class: 'nowrap' }, (j.finished || '').slice(5, 16).replace('T', ' ')),
        el('td', {}, $detail),
        el('td', { class: 'actions' }, btnRetry),
      ]);
    }

    async function tickNow() {
      btnTick.disabled = true;
      $queueInfo.textContent = '執行中（最多 4.5 分鐘）…';
      try {
        const r = await call('adminQueueTick');
        $queueInfo.textContent = r.skipped ? `略過：${r.skipped}（trigger 正在跑）` : `跑了 ${r.ran ? `${r.ran.id} → ${r.ran.state}` : '0 個 job'}；排程入列 ${r.cronEnqueued.length}；剩 ${r.remaining} queued`;
        loadQueue();
        loadApprovals();
      } catch (err) {
        $queueInfo.innerHTML = '';
        $queueInfo.append(errorBox(err));
      } finally {
        btnTick.disabled = false;
      }
    }

    async function loadApprovals() {
      $approvals.innerHTML = '';
      $approvals.append(el('div', { class: 'loading' }, '載入中…'));
      try {
        const r = await call('adminListApprovals');
        $approvals.innerHTML = '';
        if (!r.pending.length) $approvals.append(el('div', { class: 'placeholder' }, '沒有待審批的動作。'));
        r.pending.forEach((a) => $approvals.append(approvalCard(a, true)));
        if (r.decided.length) {
          $approvals.append(el('details', {}, [el('summary', { class: 'meta' }, `最近已處理 ${r.decided.length} 筆`), ...r.decided.map((a) => approvalCard(a, false))]));
        }
      } catch (err) {
        $approvals.innerHTML = '';
        $approvals.append(errorBox(err));
      }
    }

    function approvalCard(a, pending) {
      const $result = el('div');
      const btnApprove = el('button', { class: 'primary small', onclick: () => decide(a, true, [btnApprove, btnDeny], $result) }, '批准並執行');
      const btnDeny = el('button', { class: 'small danger', onclick: () => decide(a, false, [btnApprove, btnDeny], $result) }, '拒絕');
      let args = a.args;
      let parsedArgs = null;
      try { parsedArgs = JSON.parse(a.args); args = JSON.stringify(parsedArgs, null, 2); } catch (err) { /* 原樣 */ }
      const isSkill = a.tool === 'skill_manage' && parsedArgs;
      return el('div', { class: 'approval ' + (pending ? 'pending' : 'state-' + a.state) }, [
        el('div', { class: 'step-head' }, [
          el('code', {}, a.tool),
          el('span', { class: 'badge' }, pending ? '待審批' : a.state === 'approved' ? '已批准' : '已拒絕'),
          el('span', { class: 'meta' }, `${a.id} · ${a.created_at || ''}${a.decided_at ? ' → ' + a.decided_at : ''} · ${a.reason}`),
        ]),
        isSkill ? skillProposalPreview(parsedArgs) : el('pre', { class: 'approval-args' }, args),
        a.result ? el('div', { class: 'step-result' }, a.result) : null,
        pending ? el('div', { class: 'toolbar' }, [btnApprove, btnDeny]) : null,
        $result,
      ]);
    }

    /** skill_manage 提案的 diff 預覽：create 顯示全文、patch 顯示 find → replace。 */
    function skillProposalPreview(p) {
      const box = el('div', { class: 'skill-diff' });
      box.append(el('div', { class: 'step-head' }, [el('span', { class: 'badge' }, p.action === 'create' ? '新建技能' : '修補技能'), el('code', {}, p.name || ''),
        p.description ? el('span', { class: 'meta' }, p.description) : null,
        p.triggers && p.triggers.length ? el('span', { class: 'meta' }, `觸發：${[].concat(p.triggers).join('、')}`) : null]));
      if (p.action === 'create') {
        box.append(el('pre', { class: 'approval-args diff-add' }, p.content || '（無正文）'));
      } else {
        if (p.patch_find !== undefined) {
          box.append(el('div', { class: 'meta' }, '找到（將被取代）'), el('pre', { class: 'approval-args diff-del' }, p.patch_find || '（空）'),
            el('div', { class: 'meta' }, '取代成'), el('pre', { class: 'approval-args diff-add' }, p.patch_replace || '（刪除該片段）'));
        }
        if (p.content) box.append(el('div', { class: 'meta' }, '整份新正文'), el('pre', { class: 'approval-args diff-add' }, p.content));
        if (p.patch_find === undefined && !p.content) box.append(el('div', { class: 'meta' }, '只改 description / triggers / version'));
      }
      box.append(el('details', {}, [el('summary', { class: 'meta' }, '原始參數 JSON'), el('pre', { class: 'approval-args' }, JSON.stringify(p, null, 2))]));
      return box;
    }

    async function decide(a, approve, buttons, $result) {
      if (approve && !confirm(a.tool === 'skill_manage' ? `批准這個技能提案並寫入 Drive（${a.reason}）？` : `批准並立刻執行 ${a.tool}？\n\n${a.args}`)) return;
      buttons.forEach((b) => { b.disabled = true; });
      $result.innerHTML = '';
      try {
        const r = await call('adminDecideApproval', a.id, approve);
        if (r.outcome) {
          $result.append(el('div', { class: 'summary ' + (r.outcome.ok ? 'ok' : 'fail') }, r.outcome.ok ? `已執行（${r.outcome.ms} ms）` : `執行失敗：${r.outcome.status}`),
            el('div', { class: 'step-result' }, r.outcome.content));
        } else {
          $result.append(el('div', { class: 'summary fail' }, '已拒絕'));
        }
        if (r.continuation) $result.append(el('div', { class: 'meta' }, `已排續跑 job ${r.continuation}：結果會以系統訊息接回原 session（trigger 一分鐘內處理）。`));
        setTimeout(() => { loadApprovals(); loadQueue(); loadAudit(); }, 800);
      } catch (err) {
        $result.append(errorBox(err));
        buttons.forEach((b) => { b.disabled = false; });
      }
    }

    async function loadAudit() {
      $audit.innerHTML = '';
      $audit.append(el('div', { class: 'loading' }, '載入中…'));
      try {
        const rows = await call('adminListAuditLog', 50);
        $audit.innerHTML = '';
        if (!rows.length) { $audit.append(el('div', { class: 'placeholder' }, '尚無紀錄。')); return; }
        const thead = el('thead', {}, el('tr', {}, ['時間', 'session', '主體', '工具', '參數', '結果', 'ms'].map((h) => el('th', {}, h))));
        const tbody = el('tbody', {}, rows.map((r) => el('tr', { class: r.ok ? '' : 'audit-fail' }, [
          el('td', { class: 'nowrap' }, r.ts.replace('T', ' ').slice(0, 19)),
          el('td', {}, r.session_id),
          el('td', {}, r.principal && r.principal !== 'owner' ? el('span', { class: 'badge' }, r.principal) : (r.principal || '')),
          el('td', {}, el('code', {}, r.tool)),
          el('td', { class: 'audit-cell' }, r.args_preview),
          el('td', { class: 'audit-cell' }, r.result_preview),
          el('td', {}, String(r.ms)),
        ])));
        $audit.append(el('table', { class: 'table audit' }, [thead, tbody]));
      } catch (err) {
        $audit.innerHTML = '';
        $audit.append(errorBox(err));
      }
    }
  }

  // ---- 排程（Cron）------------------------------------------------------------------------------

  const JOB_STATE_LABEL = { queued: '排隊中', running: '執行中', needs_approval: '待審批', done: '完成', failed: '失敗' };
  const DELIVER_LABEL = { doc: 'doc — 建一份 Google 文件（GAS Agent/reports）', email: 'email — 寄給 owner', telegram: 'telegram — 送到 owner 的 Telegram（需先設定通道）', none: 'none — 不投遞' };

  async function renderCron(root) {
    root.append(...header('排程', '到期時由每分鐘 trigger 排進 Queue，在全新 session、無人模式（autonomous）執行；X 類工具依審批策略送審。結果依 deliver_to 投遞。schedule 用 5 欄 cron 或 hourly / daily 09:00 / weekly mon 09:00。'));
    const $status = el('span', { class: 'hint' });
    const $table = el('div', { class: 'table-wrap' }, el('div', { class: 'loading' }, '載入中…'));
    const $form = el('div', { class: 'panel', style: 'display:none' });
    const $run = el('div');
    const btnAdd = el('button', { class: 'primary', onclick: () => openForm(null) }, '新增排程');
    const btnReload = el('button', { onclick: () => load() }, '重新整理');
    root.append(el('div', { class: 'panel' }, [el('div', { class: 'toolbar' }, [btnAdd, btnReload, $status]), $table, $run]), $form);
    let data = { crons: [], providers: [], deliverTargets: ['doc', 'email', 'none'] };

    async function load() {
      $table.innerHTML = '';
      $table.append(el('div', { class: 'loading' }, '載入中…'));
      try {
        data = await call('adminListCron');
        $status.textContent = data.cronNextRun ? `下一個到期：${data.cronNextRun.slice(0, 16).replace('T', ' ')}Z` : '沒有啟用的排程';
        renderTable();
      } catch (err) {
        $table.innerHTML = '';
        $table.append(errorBox(err));
      }
    }

    function renderTable() {
      $table.innerHTML = '';
      if (!data.crons.length) {
        $table.append(el('div', { class: 'placeholder' }, '尚無排程。按「新增排程」，例如：每天 09:00「摘要昨天的信件並寫成 Doc」。'));
        return;
      }
      const thead = el('thead', {}, el('tr', {}, ['', '名稱', 'schedule', '下次', '投遞', '模型', '上次 / 狀態', ''].map((h) => el('th', {}, h))));
      const tbody = el('tbody', {}, data.crons.map((c) => {
        const btnRun = el('button', { class: 'small primary', onclick: () => runNow(c, btnRun) }, '立即執行');
        const btnEdit = el('button', { class: 'small', onclick: () => openForm(c) }, '編輯');
        const btnToggle = el('button', { class: 'small', onclick: () => toggle(c, btnToggle) }, c.enabled ? '停用' : '啟用');
        return el('tr', { class: c.enabled ? '' : 'disabled-row' }, [
          el('td', {}, el('span', { class: 'dot ' + (c.enabled ? 'on' : 'off'), title: c.enabled ? '啟用' : '停用' })),
          el('td', {}, [el('div', {}, c.name), el('div', { class: 'meta' }, c.id), el('div', { class: 'meta', title: c.prompt }, c.prompt.slice(0, 80) + (c.prompt.length > 80 ? '…' : ''))]),
          el('td', {}, [el('code', {}, c.schedule), c.cron_expr && c.cron_expr !== c.schedule ? el('div', { class: 'meta' }, c.cron_expr) : null, c.schedule_error ? el('div', { class: 'warn-text' }, c.schedule_error) : null]),
          el('td', { class: 'nowrap' }, (c.next_run || '—').slice(0, 16).replace('T', ' ')),
          el('td', {}, c.deliver_to),
          el('td', {}, c.model_pin || el('span', { class: 'meta' }, '自動')),
          el('td', {}, [el('div', { class: 'nowrap' }, (c.last_run || '—').slice(0, 16).replace('T', ' ')), el('div', { class: 'meta' }, c.last_status || '')]),
          el('td', { class: 'actions' }, [btnRun, btnEdit, btnToggle]),

      }));
      $table.append(el('table', { class: 'table' }, [thead, tbody]));

    async function toggle(c, btn) {
      btn.disabled = true;
      try { await call('adminSetCronEnabled', c.id, !c.enabled); await load(); } catch (err) { $run.innerHTML = ''; $run.append(errorBox(err)); btn.disabled = false; }
    }

    /** 立即執行：enqueue 後輪詢 job（含續跑鏈），顯示投遞結果。 */
    async function runNow(c, btn) {
      btn.disabled = true;
      $run.innerHTML = '';
      const $box = el('div', { class: 'placeholder' }, `已排入 Queue，等待每分鐘 trigger…`);
      $run.append($box);
      try {
        let job = await call('adminRunCronNow', c.id);
        const chain = [job.id];
        const t0 = Date.now();
        for (;;) {
          $box.textContent = `job ${job.id}：${JOB_STATE_LABEL[job.state] || job.state}（${Math.round((Date.now() - t0) / 1000)}s）。trigger 每分鐘跑一次；也可到「紀錄」按「處理一個 job」。`;
          await new Promise((res) => setTimeout(res, 5000));
          if (Date.now() - t0 > 30 * 60000) throw new Error('輪詢超過 30 分鐘，請到「紀錄」分頁看 Queue。');
          const j = await call('adminGetJob', job.id);
          if (!j) throw new Error(`job ${job.id} 消失了`);
          job = j;
          if (j.state === 'queued' || j.state === 'running') continue;
          const res = j.payload.result || {};

        $webhookInfo.innerHTML = '';
        $webhookInfo.append(el('span', { class: 'summary ok' }, `secret 已更換（${r.secretHint}）`), ' ');
        if (r.webhook) $webhookInfo.append(el('span', { class: 'meta' }, `已重新登記 webhook：${r.webhook.url}`));
        else if (r.webhookError) $webhookInfo.append(el('span', { class: 'warn-text' }, `重新登記 webhook 失敗：${r.webhookError}（請再按一次「設定 webhook」）`));
        else $webhookInfo.append(el('span', { class: 'meta' }, '尚未填部署 B 網址，未登記 webhook'));
        setTimeout(rerender, 1500);
      } catch (err) {
        $webhookInfo.textContent = '';
        $tgMsg.append(errorBox(err));
      }
    }
    async function replaceToken() {
      const token = $token.value.trim();
      if (!token) { $tgMsg.innerHTML = ''; $tgMsg.append(errorBox(new Error('請先在欄位貼上新的 bot token。'))); return; }
      if (data.telegram.hasToken && !confirm('更換 bot token？會先用新 token 驗證，成功後舊 token 立即停用並重新登記 webhook。')) return;
      $tgMsg.innerHTML = ''; $webhookInfo.textContent = '驗證中…';
      try {
        const r = await call('adminTelegramReplaceToken', token);
        $token.value = '';
        $webhookInfo.innerHTML = '';
        $webhookInfo.append(el('span', { class: 'summary ok' }, `token 已${r.replaced ? '更換' : '設定'}：@${r.username || r.botId}`), ' ');
        if (r.webhook) $webhookInfo.append(el('span', { class: 'meta' }, `已重新登記 webhook：${r.webhook.url}`));
        else if (r.webhookError) $webhookInfo.append(el('span', { class: 'warn-text' }, `重新登記 webhook 失敗：${r.webhookError}（請再按一次「設定 webhook」）`));
        setTimeout(rerender, 1500);
      } catch (err) {
        $webhookInfo.textContent = '';
        $tgMsg.append(errorBox(err));
      }
    }
    async function tg(fn, okText) {
      $tgMsg.innerHTML = ''; $webhookInfo.textContent = '執行中…';
      try {
        const r = await call(fn);
        const info = r && (r.info || (r.url !== undefined ? null : r));
        $webhookInfo.innerHTML = '';
        if (okText) $webhookInfo.append(el('span', { class: 'summary ok' }, okText), ' ');
        if (r && r.url) $webhookInfo.append(el('span', { class: 'meta' }, r.url), el('br'));
        if (info && typeof info === 'object' && 'url' in info) {
          $webhookInfo.append(el('span', { class: 'meta' }, `目前 webhook：${info.url || '（未登記）'} · 待處理 ${info.pending_update_count || 0}${info.last_error_message ? ' · 最後錯誤：' + info.last_error_message : ''}`));
        } else if (r && r.chatId) {
          $webhookInfo.append(el('span', { class: 'meta' }, `chat ${r.chatId}`));
        }
      } catch (err) {
        $webhookInfo.textContent = '';
        $tgMsg.append(errorBox(err));
      }
    }
    async function em(fn, okText) {
      $emMsg.innerHTML = '';
      try {
        const r = await call(fn);
        $emMsg.append(el('span', { class: 'summary ok' }, okText || `掃了 ${r.scanned} 串，排入 ${r.enqueued.length} 個 job${r.enqueued.length ? '：' + r.enqueued.map((x) => x.subject || x.threadId).join('、') : ''}；略過 ${r.skipped}`));
      } catch (err) {
        $emMsg.append(errorBox(err));
      }
    }
  }

  // ---- 尚未實作的分頁 ----------------------------------------------------------

  function renderPlaceholder(item) {
    return (root) => {
      root.append(...header(item.label));
      root.append(el('div', { class: 'placeholder' },
        `「${item.label}」分頁預計在 ${item.milestone} 實作。`));
    };
  }

  // ---- 路由 ------------------------------------------------------------------

  const VIEWS = { dashboard: renderDashboard, doctor: renderDoctor, models: renderModels, chat: renderChat, tools: renderTools, logs: renderLogs, memory: renderMemory, settings: renderSettings, cron: renderCron, skills: renderSkills, channels: renderChannels };
  NAV.forEach((item) => { if (!VIEWS[item.id]) VIEWS[item.id] = renderPlaceholder(item); });

  function currentRoute() {
    const id = (location.hash || '').replace(/^#\/?/, '');
    return NAV.some((n) => n.id === id) ? id : 'dashboard';
  }

  function renderNav() {
    $nav.innerHTML = '';
    const active = currentRoute();
    NAV.forEach((item) => {
      // GAS 的 HtmlService 會注入 <base target="_top">，hash 連結若交給瀏覽器預設行為，整個視窗會跳到
      // userCodeAppPanel 空白頁。所以一律 preventDefault 後自己改 location.hash（target=_self 只是保險）。
      $nav.append(el('a', {
        href: '#/' + item.id,
        target: '_self',
        class: item.id === active ? 'active' : '',
        onclick: (ev) => { ev.preventDefault(); location.hash = '/' + item.id; },
      }, item.label));
    });
  }

  function route() {
    renderNav();
    $main.innerHTML = '';
    const view = VIEWS[currentRoute()];
    Promise.resolve(view($main)).catch((err) => $main.append(errorBox(err)));
  }

  document.getElementById('brand-version').textContent = bootstrap.version ? 'v' + bootstrap.version : '';
  document.getElementById('owner-email').textContent = bootstrap.owner || '';
  window.addEventListener('hashchange', route);
  route();
})();
</script>
